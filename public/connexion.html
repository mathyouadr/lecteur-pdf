<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion · Lecteur</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27%3E%3Cstop stop-color=%27%23f08a4b%27/%3E%3Cstop offset=%271%27 stop-color=%27%23c4378f%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%279%27 fill=%27url(%23g)%27/%3E%3C/svg%3E">
</head>
<body>
<div class="centre">
  <form class="carte" id="formulaire">
    <div class="marque">Lecteur</div>
    <div class="onglets" role="tablist">
      <button type="button" role="tab" id="o-connexion" aria-selected="true">Connexion</button>
      <button type="button" role="tab" id="o-inscription" aria-selected="false">Créer un compte</button>
    </div>
    <label class="champ">Identifiant
      <input id="identifiant" autocomplete="username" required minlength="3" maxlength="32" pattern="[\w.\-]+">
    </label>
    <label class="champ">Mot de passe
      <input id="mdp" type="password" autocomplete="current-password" required minlength="8" maxlength="256">
    </label>
    <button class="principal" id="valider">Se connecter</button>
    <div class="message" id="message" role="status"></div>
  </form>
</div>
<script src="/commun.js"></script>
<script>
let mode = "connexion";

function choisir(m) {
  mode = m;
  $("o-connexion").setAttribute("aria-selected", m === "connexion");
  $("o-inscription").setAttribute("aria-selected", m === "inscription");
  $("valider").textContent = m === "connexion" ? "Se connecter" : "Demander un compte";
  $("mdp").autocomplete = m === "connexion" ? "current-password" : "new-password";
  $("message").textContent = m === "inscription" ? "L'administrateur validera ton compte avant ta première connexion." : "";
  $("message").className = "message";
}
$("o-connexion").onclick = () => choisir("connexion");
$("o-inscription").onclick = () => choisir("inscription");

$("formulaire").onsubmit = async e => {
  e.preventDefault();
  $("valider").disabled = true;
  try {
    await api(`/api/${mode}`, envoi({ identifiant: $("identifiant").value.trim(), mdp: $("mdp").value }));
    if (mode === "connexion") return void (location.href = "/bibliotheque.html");
    choisir("connexion");
    $("mdp").value = "";
    $("message").textContent = "Demande envoyée ! Tu pourras te connecter dès que l'administrateur l'aura validée.";
  } catch (err) {
    $("message").textContent = err.message;
    $("message").className = "message erreur";
  } finally {
    $("valider").disabled = false;
  }
};

// Déjà connecté : direction la bibliothèque
fetch("/api/moi").then(r => r.ok && (location.href = "/bibliotheque.html"));
</script>
</body>
</html>
