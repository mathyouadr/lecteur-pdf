<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture · Lecteur</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27%3E%3Cstop stop-color=%27%23f08a4b%27/%3E%3Cstop offset=%271%27 stop-color=%27%23c4378f%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%279%27 fill=%27url(%23g)%27/%3E%3C/svg%3E">
</head>
<body class="lecteur">
<header class="entete">
  <div class="barre">
    <a class="lien" href="/bibliotheque.html" aria-label="Retour à la bibliothèque">←</a>
    <div class="titre-livre" id="titre">…</div>
    <button id="lire" class="principal" disabled>▶ Lire</button>
    <select id="vitesse" aria-label="Vitesse de lecture">
      <option value="0.8">0,8×</option><option value="1" selected>1×</option><option value="1.25">1,25×</option>
      <option value="1.5">1,5×</option><option value="1.75">1,75×</option><option value="2">2×</option>
      <option value="2.5">2,5×</option><option value="3">3×</option><option value="4">4×</option><option value="5">5×</option>
    </select>
  </div>
  <div class="avance"><i id="avance"></i></div>
</header>
<main class="page">
  <div class="message" id="etat" role="status"></div>
  <div id="texte"></div>
</main>
<script src="/commun.js"></script>
<script>
const idLivre = +new URLSearchParams(location.search).get("livre");
let phrases = [];          // <span> de chaque phrase
let courant = 0;           // index de la phrase lue
let enLecture = false;
let audio = null;
let cache = new Map();     // index -> Promise<URL audio>
let generation = 0;        // invalide les lectures en cours quand on saute ou change de réglage

// ---------- Chargement du livre ----------
api(`/api/livres/${idLivre}`).then(livre => {
  document.title = `${livre.titre} · Lecteur`;
  $("titre").textContent = livre.titre;
  $("vitesse").value = [...$("vitesse").options].some(o => +o.value === livre.vitesse) ? String(livre.vitesse) : "1";
  afficher(livre.paragraphes);
  courant = Math.min(livre.phrase, phrases.length - 1);
  marquer();
  $("etat").textContent = livre.phrase ? "Reprise là où tu t'étais arrêté. Clique une phrase pour lire à partir de là."
                                       : "Clique une phrase pour lire à partir de là, ou appuie sur Espace.";
}).catch(err => { $("etat").textContent = err.message; $("etat").className = "message erreur"; });

function afficher(paragraphes) {
  const zone = $("texte");
  const decoupe = new Intl.Segmenter("fr", { granularity: "sentence" });
  for (const para of paragraphes) {
    const p = document.createElement("p");
    for (const { segment } of decoupe.segment(para)) {
      if (!segment.trim()) continue;
      const s = document.createElement("span");
      s.textContent = segment;
      const i = phrases.length;
      s.onclick = () => lireDepuis(i);
      phrases.push(s);
      p.append(s);
    }
    zone.append(p);
  }
  $("lire").disabled = false;
}

// ---------- Progression ----------
function marquer() {
  phrases.forEach(s => s.classList.remove("lue"));
  if (phrases[courant]) {
    phrases[courant].classList.add("lue");
    phrases[courant].scrollIntoView({ block: "center", behavior: "smooth" });
  }
  $("avance").style.width = `${phrases.length ? (courant / phrases.length) * 100 : 0}%`;
}

// ---------- Temps d'écoute (pour les stats) ----------
let ecoute = 0;            // secondes d'audio réellement jouées depuis le dernier envoi
let phrasesLues = 0;       // phrases écoutées jusqu'au bout depuis le dernier envoi
let debut = 0;             // performance.now() du début de la lecture en cours, 0 si à l'arrêt

function arreterChrono() {
  if (debut) { ecoute += (performance.now() - debut) / 1000; debut = 0; }
}

function suivre(a) {
  a.addEventListener("playing", () => { arreterChrono(); debut = performance.now(); });
  a.addEventListener("pause", arreterChrono);
  a.addEventListener("ended", arreterChrono);
}

function sauver() {
  if (!phrases.length) return;
  const enCours = debut > 0;
  arreterChrono();
  if (enCours) debut = performance.now();   // la phrase continue : on repart de maintenant
  const corps = { phrase: courant, total: phrases.length, vitesse: +$("vitesse").value,
                  secondes: Math.round(ecoute * 10) / 10, phrases_lues: phrasesLues };
  ecoute = 0;
  phrasesLues = 0;
  api(`/api/livres/${idLivre}/progression`, envoi(corps, { keepalive: true })).catch(() => {});
}
addEventListener("pagehide", sauver);

// ---------- Synthèse et lecture ----------
function son(i) {
  if (!cache.has(i)) {
    cache.set(i, api("/api/tts", envoi({ texte: phrases[i].textContent })).then(b => URL.createObjectURL(b)));
  }
  return cache.get(i);
}

async function boucle(gen) {
  while (enLecture && gen === generation && courant < phrases.length) {
    marquer();
    sauver();
    for (let k = 1; k <= 2 && courant + k < phrases.length; k++) son(courant + k).catch(() => {}); // précharge la suite
    let url;
    try { url = await son(courant); }
    catch (err) { cache.delete(courant); $("etat").textContent = err.message; return pause(); }
    if (gen !== generation) return;
    audio = new Audio(url);
    audio.playbackRate = +$("vitesse").value;   // le navigateur garde la hauteur de la voix
    suivre(audio);
    await new Promise(fin => { audio.onended = fin; audio.onerror = fin; audio.play().catch(fin); });
    if (audio.ended) phrasesLues++;
    if (gen !== generation || !enLecture) return;
    URL.revokeObjectURL(url);
    cache.delete(courant);
    courant++;
  }
  if (courant >= phrases.length) {
    pause();
    sauver();               // phrase = total : livre terminé
    $("avance").style.width = "100%";
    courant = 0;
    $("etat").textContent = "Lecture terminée.";
  }
}

function lireDepuis(i) {
  generation++;
  if (audio) audio.pause();
  courant = i;
  enLecture = true;
  $("etat").textContent = "";
  $("lire").textContent = "❚❚ Pause";
  boucle(generation);
}

function pause() {
  enLecture = false;
  if (audio) audio.pause();
  $("lire").textContent = "▶ Lire";
  sauver();
}

$("lire").onclick = () => {
  if (enLecture) return pause();
  if (audio && !audio.ended && audio.currentTime > 0) {    // reprise au milieu d'une phrase
    enLecture = true;
    $("lire").textContent = "❚❚ Pause";
    const gen = generation;
    audio.play();
    audio.onended = () => { phrasesLues++; if (gen === generation && enLecture) { cache.delete(courant); courant++; boucle(gen); } };
    return;
  }
  lireDepuis(courant);
};

$("vitesse").onchange = () => {
  if (audio) audio.playbackRate = +$("vitesse").value;
  sauver();
};

document.addEventListener("keydown", e => {
  if (e.code === "Space" && phrases.length && !["SELECT", "BUTTON"].includes(e.target.tagName)) {
    e.preventDefault();
    $("lire").click();
  }
});
</script>
</body>
</html>
