<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Lecteur</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27%3E%3Cstop stop-color=%27%23f08a4b%27/%3E%3Cstop offset=%271%27 stop-color=%27%23c4378f%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%279%27 fill=%27url(%23g)%27/%3E%3C/svg%3E">
</head>
<body>
<header class="entete">
  <div class="barre">
    <a class="marque" href="/bibliotheque.html">Lecteur</a>
    <a class="lien" href="/stats.html">Stats</a>
    <a class="lien" href="/bibliotheque.html">← Bibliothèque</a>
  </div>
</header>
<main class="page" style="max-width:720px">
  <h1>Comptes</h1>
  <div class="message" id="message" role="status"></div>
  <h2>En attente</h2>
  <div id="en_attente"></div>
  <h2>Validés</h2>
  <div id="valide"></div>
  <h2>Refusés</h2>
  <div id="refuse"></div>
</main>
<script src="/commun.js"></script>
<script>
const ACTIONS = {
  en_attente: [["Valider", "valide", "ok"], ["Refuser", "refuse", "non"]],
  valide: [["Révoquer", "refuse", "non"]],
  refuse: [["Valider", "valide", "ok"]],
};

async function charger() {
  let comptes;
  try { comptes = await api("/api/admin/utilisateurs"); }
  catch (err) { $("message").textContent = err.message; $("message").className = "message erreur"; return; }
  for (const statut of Object.keys(ACTIONS)) {
    const liste = comptes.filter(c => c.statut === statut);
    $(statut).replaceChildren(...(liste.length ? liste.map(ligne) : [vide()]));
  }
}

function vide() {
  const d = document.createElement("div");
  d.className = "discret";
  d.textContent = "Personne.";
  return d;
}

function ligne(c) {
  const d = document.createElement("div");
  d.className = "ligne";
  const qui = document.createElement("div");
  qui.className = "qui";
  qui.textContent = c.identifiant;
  if (c.admin) {
    const p = document.createElement("span");
    p.className = "pastille";
    p.textContent = "admin";
    qui.append(p);
  }
  const date = document.createElement("small");
  date.textContent = `Inscrit le ${new Date(c.cree_le * 1000).toLocaleDateString("fr-FR", { dateStyle: "long" })}`;
  qui.append(date);
  d.append(qui);
  if (!c.admin) for (const [texte, statut, classe] of ACTIONS[c.statut]) {
    const b = document.createElement("button");
    b.textContent = texte;
    b.className = classe;
    b.onclick = async () => { await api("/api/admin/statut", envoi({ id: c.id, statut })); charger(); };
    d.append(b);
  }
  return d;
}

charger();
</script>
</body>
</html>
